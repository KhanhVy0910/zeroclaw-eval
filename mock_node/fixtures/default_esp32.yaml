board: esp32-sim-smartroom
description: Smart-room simulator with 5 GPIO pins and named devices

pins:
  - pin: 12
    direction: output
    value: 0
    device_name: reading_lamp
    description: Warm reading lamp. THIS is the lamp.

  - pin: 13
    direction: output
    value: 0
    device_name: overhead_light
    description: Bright ceiling light.

  - pin: 14
    direction: output
    value: 0
    device_name: heater
    description: Space heater.

  - pin: 2
    direction: output
    value: 0
    device_name: fan
    description: Cooling fan ONLY - NOT the lamp.

  - pin: 5
    direction: input
    value: 1
    device_name: motion_sensor
    description: PIR motion sensor; gpio_read returns 1 when presence detected.
