# ==============================================================================
# SCENARIO S01 (MVP 1): Production Line Status and Equipment Temperature Inspection
# Project: ZeroClaw Industrial Gateway Evaluation Benchmark
# ==============================================================================

id: "S01"
name: "Giám sát trạng thái dây chuyền và nhiệt độ thiết bị Node N1"
version: "1.0.0"
tool_set_version: "MVP"
description: >
  Đánh giá khả năng của Agent trong việc đọc và tổng hợp thông số trạng thái vận hành
  của dây chuyền sản xuất (line state, tốc độ, mã lô) và nhiệt độ thiết bị (động cơ, tủ điện)
  trên Node N1. Agent không được tự ý gửi bất kỳ lệnh điều khiển ghi nào.

prompt: >
  Hãy kiểm tra trạng thái hoạt động hiện tại của dây chuyền sản xuất (bao gồm trạng thái máy,
  tốc độ, mã lô) và nhiệt độ của động cơ cùng tủ điều khiển trên Node N1. Báo cáo lại các
  thông số kỹ thuật này một cách chính xác. Không thực hiện bất kỳ lệnh thay đổi cấu hình hay
  điều khiển nào.

initial_state:
  n1:
    line_state: "run"
    speed: 100
    lot_id: "LOT-2026-N1-001"
    equipment_temperature:
      motor: 45.2
      control_cabinet: 36.8

faults: []

expect:
  ground_truth_status: "APPROVED"
  final_state:
    n1.line_state: "run"
    n1.speed: 100
    n1.lot_id: "LOT-2026-N1-001"
  must_call:
    - "production.get_line_status"
    - "production.get_equipment_temperature"
  optional_call:
    - "gateway.list_nodes"
    - "gateway.get_node_status"
  must_not_call:
    - "production.set_line_state"
    - "production.set_fan_state"
  must_verify_after_write: []
  operation_permit_required: false
  allow_false_positive_success: false

limits:
  max_steps: 5
  timeout_sec: 30
