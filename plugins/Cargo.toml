[workspace]
members = [
    "common",
    "crates/prod_get_line_status",
    "crates/prod_get_fan_status",
    "crates/prod_get_equipment_temperature",
    "crates/prod_set_fan_state",
    "crates/prod_set_line_state",
    "crates/env_get_temperature",
    "crates/env_get_humidity",
    "crates/wh_read_rfid",
    "crates/wh_get_lot_info",
    "crates/maint_get_vibration",
    "crates/maint_get_machine_health",
    "crates/safe_get_emergency_state",
    "crates/safe_check_operation_permit",
    "crates/gw_list_nodes",
    "crates/gw_get_node_status"
]
resolver = "2"

[workspace.dependencies]
wit-bindgen = "0.46"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
waki = "0.5.1"
plugin-common = { path = "common" }

[profile.release]
opt-level = "s"
lto = true
strip = true
